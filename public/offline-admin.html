<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Afsona — aloqa yo'q</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f7f6fa;
        color: #17141f;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #131019; color: #f2f0f7; }
        .box { background: #1c1826 !important; border-color: #2a2536 !important; }
        .hint { color: #9b95a8 !important; }
      }
      .box {
        max-width: 380px;
        width: 100%;
        text-align: center;
        background: #fff;
        border: 1px solid #eceaf2;
        border-radius: 18px;
        padding: 32px 24px;
      }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 16px;
        display: grid; place-items: center;
        border-radius: 16px; background: #e23744; color: #fff;
        font-size: 26px;
      }
      h1 { margin: 0 0 8px; font-size: 19px; }
      .hint { margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: #6b6577; }
      button {
        font: inherit; font-weight: 700; cursor: pointer;
        border: 0; border-radius: 12px; padding: 11px 22px;
        background: #e23744; color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="mark">&#128246;</div>
      <h1>Internet aloqasi yo'q</h1>
      <p class="hint">
        Boshqaruv paneli ishlashi uchun aloqa kerak — buyurtmalar jonli
        holatda yuklanadi. Aloqani tekshirib, qaytadan urinib ko'ring.
      </p>
      <button onclick="location.reload()">Qayta urinish</button>
    </div>
  </body>
</html>
